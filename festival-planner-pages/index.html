<title>節慶行銷企劃台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: persistent left rail + working canvas. Dashboard answers "what do I do today"; the workbench is one guided flow (festival > trend > products > schedule > copy). */
/* Brand tokens mirror the 5173 studio: paper, deep green, peach accent; serif headings. */
:root{
  --bg:#fbfaf6;--sf:#fffefa;--sf2:#eef1e8;--ink:#263b38;--mu:#7b837a;--bd:#e8e9e0;
  --ac:#285d56;--acs:#e3eee9;--acx:#ffffff;
  --ok:#285d56;--okb:#e3eee9;--wr:#8a4b1c;--wrb:#f3d4b9;--er:#a4453a;--erb:#f5dcd7;
  --g1:#b08a58;--g2:#5f8f7e;--g3:#8f7fb0;--rail:#f4f3ec;
  --f-d:'Noto Serif TC',Georgia,serif;--f-b:'DM Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;--f-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a18;--sf:#1a2422;--sf2:#243230;--ink:#e8efe9;--mu:#9baba3;--bd:#2f3d3a;
  --ac:#7fc4b3;--acs:#1f3733;--acx:#0d1a17;
  --ok:#8fd6c4;--okb:#1f3733;--wr:#f0c08f;--wrb:#3d2e1f;--er:#f0948b;--erb:#3b201d;
  --g1:#d2ae7c;--g2:#8fc4b2;--g3:#b5a6d6;--rail:#172120;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a18;--sf:#1a2422;--sf2:#243230;--ink:#e8efe9;--mu:#9baba3;--bd:#2f3d3a;
  --ac:#7fc4b3;--acs:#1f3733;--acx:#0d1a17;
  --ok:#8fd6c4;--okb:#1f3733;--wr:#f0c08f;--wrb:#3d2e1f;--er:#f0948b;--erb:#3b201d;
  --g1:#d2ae7c;--g2:#8fc4b2;--g3:#b5a6d6;--rail:#172120;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.2}h2{font-size:17px}h3{font-size:15px}
small,.mu{color:var(--mu)}small{font-size:12px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;background:var(--sf)}
.brand{font-family:var(--f-d);font-weight:700;font-size:17px;padding:4px 10px 18px;display:flex;gap:10px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:grid;place-items:center;color:var(--acx)}
.nv{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nv:hover{background:var(--sf2);color:var(--ink)}
.nv[aria-current=page]{background:var(--ink);color:var(--bg)}
.nv span small{display:block;font-size:11px;color:inherit;opacity:.7;line-height:1.2}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--mu)}
.main{min-width:0;padding-left:max(0px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sf)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px max(24px,env(safe-area-inset-right,0px)) 10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .grow{flex:1;min-width:140px;max-width:340px;position:relative}
.top .grow svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mu)}
.top .grow input{padding-left:34px}
#pg{padding:24px max(24px,env(safe-area-inset-right,0px)) 120px 24px;max-width:1280px;display:flex;flex-direction:column;gap:20px}
.banner{padding:10px max(24px,env(safe-area-inset-right,0px)) 10px 24px;background:var(--ink);color:var(--bg);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.banner b{font-weight:700}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;min-width:0}
.card>h2{margin-bottom:12px;display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.card>h2 small{font-family:var(--f-b);font-weight:400}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}.btn.pri:hover{filter:brightness(1.06)}
.btn.gh{border-color:transparent;background:transparent}.btn.gh:hover{background:var(--sf2)}.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;padding:2px;background:var(--sf2);gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--mu);min-height:30px}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0002}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wr{background:var(--wrb);color:var(--wr)}.chip.er{background:var(--erb);color:var(--er)}.chip.ac{background:var(--acs);color:var(--ac)}
button.chip{border:1px solid var(--bd);cursor:pointer;background:var(--sf);color:var(--ink);min-height:30px;padding:3px 11px}
button.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.inp{width:100%;border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:8px 10px;min-height:38px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);min-width:0}
.fs{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:16px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-d);font-size:30px;line-height:1.1;margin-top:2px}
.act{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}
.act:first-of-type{border-top:0}
.track{position:relative;height:26px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/17.14 - 1px),var(--bd) calc(100%/17.14 - 1px) calc(100%/17.14));border-radius:4px}
.lane{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px}
.lane .bar{position:absolute;top:5px;height:16px;border-radius:4px;background:var(--acs);border:1px solid var(--ac)}
.lane .cut{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.lane .today{position:absolute;top:-4px;bottom:-4px;left:0;width:2px;background:var(--ac)}
.ticks{position:relative;height:16px;margin-left:142px;font-size:11px;color:var(--mu)}.ticks span{position:absolute}
.stg{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding:8px 0}
.stg i{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--bd)}
.stg.active i{background:var(--ac);box-shadow:0 0 0 4px var(--acs)}.stg.past i{background:var(--mu)}
.sb{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;position:relative;margin:6px 0 10px}
.sb span{background:var(--sf2)}.sb span.active{background:var(--ac)}.sb span.past{background:var(--mu)}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--sf2);flex:none;display:grid;place-items:center;font-size:24px;overflow:hidden}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--bd)}
.prow:first-of-type{border-top:0}
.mini{width:56px!important;padding:4px 6px;min-height:30px;text-align:center}
.meter{height:5px;background:var(--sf2);border-radius:3px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--ac)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ac);font-weight:700}
.wb{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.wb>.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px)}
.bar-fix{position:fixed;left:224px;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--bd);padding:10px max(24px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>div{min-height:84px;border:1px solid var(--bd);border-radius:6px;padding:4px;background:var(--sf);font-size:12px;min-width:0}
.cal .h{min-height:auto;border:0;background:none;text-align:center;color:var(--mu)}.cal .t{outline:2px solid var(--ac)}.cal .x{background:none;border:0}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--g1);background:var(--sf2);padding:1px 5px;margin-top:3px;border-radius:3px;cursor:pointer;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mu);font-weight:500;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}.tbl td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.scroll{overflow-x:auto}
.pre{white-space:pre-wrap;background:var(--sf2);border-radius:8px;padding:12px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:10px}
.warn{padding:10px 14px;border-radius:8px;background:var(--wrb);color:var(--wr);border-left:3px solid var(--wr)}.warn.er{background:var(--erb);color:var(--er);border-color:var(--er)}.warn.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.mask{position:fixed;inset:0;background:#0008;z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:var(--sf);border-radius:14px;padding:20px;width:100%;max-width:640px;max-height:92vh;overflow:auto;border:1px solid var(--bd);display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:70}
.tabbar{display:none}
.hint{font-size:12px;color:var(--mu)}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sf);border-top:1px solid var(--bd);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;color:var(--mu);min-height:48px;cursor:pointer}
  .tabbar button[aria-current=page]{color:var(--ac);font-weight:700}
  .wb{grid-template-columns:minmax(0,1fr)}.wb>.left{position:static}
  .bar-fix{left:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
  .act{grid-template-columns:minmax(0,1fr) auto}.act>:nth-child(3){grid-column:1/-1;order:3}
  .lane{grid-template-columns:84px minmax(0,1fr)}.ticks{margin-left:94px}
  .top,#pg,.banner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #pg{padding-bottom:170px}h1{font-size:23px}.top .grow{max-width:none}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .cal>div{min-height:58px}.ev{font-size:10px;padding:0 3px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const HDR={zh:['商品名稱','產品名稱','名稱','name','productname'],sku:['sku','貨號','編號'],type:['類型','商品類型','type','producttype'],cat:['品類','分類','category'],target:['目標受眾','受眾','target','targetaudience'],sp:['核心賣點','賣點','sellingpoints'],desc:['說明','商品說明','description'],price:['價格','售價','price'],cur:['幣別','currency'],img:['圖片網址','圖片','imagesrc','image','imageurl'],p:['製作天數','productiondays','production'],s:['配送天數','shippingdays','shipping'],b:['緩衝天數','bufferdays','buffer'],h:['節慶標籤','holidaytags'],t:['話題標籤','topictags'],e:['情感標籤','emotiontags'],av:['供貨','availability','available']};
const nk=s=>String(s).toLowerCase().replace(/[\s_\-()（）]/g,'');
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
function impM(){M(`<h3>匯入 Excel / CSV</h3><p class="mu">第一列是欄位名稱，中文或英文皆可。必填欄位是「商品名稱」。標籤欄位用逗號分隔。</p><div class="pre mono" style="font-size:12px">商品名稱, SKU, 類型, 品類, 價格, 幣別, 製作天數, 配送天數, 緩衝天數, 節慶標籤, 話題標籤, 情感標籤, 受眾標籤, 圖片網址, 核心賣點</div>
  <label class="btn pri" style="cursor:pointer">${ic('up',16)}選擇檔案<input type="file" id="imf" accept=".xlsx,.xls,.csv" hidden onchange="impFile(this)"></label><div class="row"><button class="btn" onclick="tmpl()">取得範本</button><button class="btn" onclick="closeM()">取消</button></div>`)}
function tmpl(){showCSV('商品名稱,SKU,類型,品類,價格,幣別,製作天數,配送天數,緩衝天數,節慶標籤,話題標籤,情感標籤,受眾標籤,圖片網址,核心賣點\n聖誕賀卡,GC-XM2,實體,賀卡,6.5,USD,2,5,2,christmas,family;pets,warmth;joy,Family;Friends,,\n聖誕 AR 卡,AR-XM2,AR 電子,賀卡,3.99,USD,0,0,0,christmas,last-minute,joy,Family,,\n','範本 CSV')}
function impFile(inp){
  const f=inp.files[0];if(!f)return;
  const done=rows=>{
    if(rows.length<2){toast('檔案沒有資料列');return}
    const hd=rows[0].map(nk),idx={};for(const [k,names] of Object.entries(HDR)){const i=hd.findIndex(x=>names.includes(x));if(i>=0)idx[k]=i}
    if(idx.zh===undefined){M(`<h3>找不到「商品名稱」欄位</h3><p class="mu">偵測到的欄位：${esc(rows[0].join('、'))}</p><button class="btn" onclick="closeM()">關閉</button>`);return}
    const out=[],bad=[];rows.slice(1).forEach((r,i)=>{const g=k=>idx[k]===undefined?'':String(r[idx[k]]??'').trim();if(!g('zh')){bad.push(i+2);return}
      const ar=/ar|電子|digital/i.test(g('type'));out.push({id:'',sku:g('sku')||'IMP-'+(i+1),name:g('zh'),zh:g('zh'),type:ar?'AR Digital':'Physical',emoji:'',desc:g('desc'),sp:g('sp'),target:g('target'),h:csvl(g('h')),t:csvl(g('t')),e:csvl(g('e')),aud:csvl(g('aud')),cat:g('cat')||'賀卡',price:+g('price')||0,cur:g('cur')||'USD',av:!/^(0|否|false|停售|n)$/i.test(g('av')||'1'),p:ar?0:(g('p')===''?2:+g('p')||0),s:ar?0:(g('s')===''?5:+g('s')||0),b:ar?0:(g('b')===''?2:+g('b')||0),img:g('img')})});
    window._imp=out;
    M(`<h3>讀到 ${out.length} 筆商品</h3>${bad.length?`<div class="warn">第 ${bad.join('、')} 列缺少商品名稱，已略過。</div>`:''}<p class="mu">合併：依 SKU 更新既有商品，沒有的就新增。取代：清空目前商品後匯入。</p><div class="row"><button class="btn" onclick="closeM()">取消</button><button class="btn" onclick="applyImp('replace')">取代全部</button><button class="btn pri" onclick="applyImp('merge')">合併</button></div>`);
  };
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='csv'){const r=new FileReader();r.onload=()=>done(parseCSV(String(r.result).replace(/^﻿/,'')));r.readAsText(f)}
  else if(window.XLSX){const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}))}catch(e){toast('無法讀取這個檔案')}};r.readAsArrayBuffer(f)}
  else toast('試算表元件載入失敗，請另存為 CSV 再匯入');
}

const HH={en:['節慶名稱','英文名稱','name','holiday','節慶'],zh:['中文','中文名稱','zh'],date:['日期','date','節慶日'],grp:['分類','類型','category','type','group'],tags:['標籤','關鍵字','tags']};
function impH(){M(`<h3>匯入節慶（Excel / CSV）</h3><p class="mu">第一列是欄位名稱。必填：節慶名稱、日期（YYYY-MM-DD）。分類填「主要銷售型」「情感祝福型」「社群話題型」。標籤用逗號分隔。同日期同名稱會更新，其他新增。</p><div class="pre mono" style="font-size:12px">節慶名稱, 中文, 日期, 分類, 標籤</div><label class="btn pri" style="cursor:pointer">${ic('up',16)}選擇檔案<input type="file" id="imh" accept=".xlsx,.xls,.csv" hidden onchange="impHFile(this)"></label><div class="row"><button class="btn" onclick="showCSV('節慶名稱,中文,日期,分類,標籤\\nMother\\u2019s Day,母親節,2027-05-09,主要銷售型,\"mothers day,mom\"\\nNational Dog Day,美國狗狗日,2027-08-26,社群話題型,dogs\\n','節慶範本 CSV')">取得範本</button><button class="btn" onclick="closeM()">取消</button></div>`)}
function impHFile(inp){
  const f=inp.files[0];if(!f)return;
  const done=rows=>{
    if(rows.length<2){toast('檔案沒有資料列');return}
    const hd=rows[0].map(nk),idx={};for(const [k,names] of Object.entries(HH)){const i=hd.findIndex(x=>names.map(nk).includes(x));if(i>=0)idx[k]=i}
    if(idx.en===undefined&&idx.zh===undefined||idx.date===undefined){M(`<h3>找不到必要欄位</h3><p class="mu">需要「節慶名稱」與「日期」。偵測到：${esc(rows[0].join('、'))}</p><button class="btn" onclick="closeM()">關閉</button>`);return}
    const out=[],bad=[];rows.slice(1).forEach((r,i)=>{const g=k=>idx[k]===undefined?'':String(r[idx[k]]??'').trim();let dt=g('date').replace(/\//g,'-').replace(/T.*/,'').slice(0,10);if(/^\d{5}$/.test(dt)){const x=new Date(Math.round((+dt-25569)*864e5));dt=x.toISOString().slice(0,10)}if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||!(g('en')||g('zh'))){bad.push(i+2);return}
      const c=g('grp'),grp=/主要|major|sales|main/i.test(c)?'S':/情感|emotion|greeting/i.test(c)?'E':'B',en=g('en')||g('zh'),tg=csvl(g('tags'));
      out.push({en,zh:g('zh')||zh(en),date:dt,grp,tags:tg.length?tg:[en.replace(/[^A-Za-z0-9]+/g,'')].filter(Boolean)})});
    window._impH=out;
    M(`<h3>讀到 ${out.length} 個節慶</h3>${bad.length?`<div class="warn">第 ${bad.join('、')} 列日期或名稱不正確，已略過。</div>`:''}<p class="mu">合併後節慶總數會同步到日曆、儀表板與工作台。</p><div class="row"><button class="btn" onclick="closeM()">取消</button><button class="btn pri" onclick="applyH()">匯入</button></div>`);
  };
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='csv'){const r=new FileReader();r.onload=()=>done(parseCSV(String(r.result).replace(/^\ufeff/,'')));r.readAsText(f)}
  else if(window.XLSX){const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array',cellDates:false});done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false,dateNF:'yyyy-mm-dd'}))}catch(e){toast('無法讀取這個檔案')}};r.readAsArrayBuffer(f)}
  else toast('試算表元件載入失敗，請另存為 CSV 再匯入');
}
function applyH(){
  const L=window._impH||[];let add_=0,upd=0;
  L.forEach(n=>{const ex=S.holidays.find(h=>h.market===S.market&&h.date===n.date&&(h.en.toLowerCase()===n.en.toLowerCase()||h.zh===n.zh));
    if(ex){Object.assign(ex,{zh:n.zh,grp:n.grp,tags:n.tags});upd++}
    else{S.holidays.push({id:'imp'+Date.now()+Math.random().toString(36).slice(2,6),market:S.market,en:n.en,zh:n.zh,date:n.date,grp:n.grp,aud:['Family','Friends'],themeEn:'',theme:'',emo:'joy',tags:n.tags,aff:['通用問候與生活'],tone:''});add_++}});
  closeM();render();toast(`新增 ${add_} 個、更新 ${upd} 個節慶`);
}
function applyImp(mode){
  const L=window._imp||[];if(mode==='replace')S.products=[];
  L.forEach(n=>{const ex=S.products.find(p=>p.sku===n.sku);if(ex)Object.assign(ex,{...n,id:ex.id,emoji:ex.emoji});else{n.id='p'+Date.now()+Math.random().toString(36).slice(2,6);S.products.push(n)}});

const q=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v;

let SMP=null;const AI={busy:false,err:'',ctl:null};
const AIERR={not_granted:'你尚未允許使用 Claude，請重新整理後在提示中選擇允許。',sampling_disabled:'這個帳號目前無法使用 Claude。',rate_limited:'呼叫太頻繁或已達使用上限，請稍後再試。',session_expired:'登入已過期，請重新登入後再試。',invalid_json:'Claude 回覆的格式不正確，請再按一次。',refused:'Claude 無法處理這份內容，請換一款商品或語氣。',empty_completion:'Claude 沒有回覆，請再試一次。',upstream_error:'連線中斷，請再試一次。'};
async function aiGen(){
  const h=H(S.hid),ps=S.sel.map(P).filter(Boolean);let p=P(S.pid);if(!p||!S.sel.includes(p.id))p=ps[0];
  if(!SMP||!h||!p||AI.busy)return;
  const sc=sched(h.date,[p]),t=curTrend(),L=S.lang,inst=p.type!=='Physical';
  const fact=[`Holiday: ${h.en} (${h.zh}), ${h.date}, ${sc.days??diff(h.date,today())} days away`,
   `Product: ${p.name}${p.zh&&p.zh!==p.name?' ('+p.zh+')':''}; type: ${inst?'AR / digital card, delivered instantly by download':'physical greeting card'}; category: ${CAT_EN[p.cat]||p.cat}${p.price?'; price: '+price(p):''}${p.sp?'; selling points: '+p.sp:''}${p.desc?'; note: '+p.desc:''}`,
   inst?'Delivery: instant download, can be sent in seconds.':(sc.passed?`Physical promotion window has CLOSED (cutoff was ${sc.last}). Do not promise delivery by the holiday; steer to the AR/digital option.`:`Physical promotion cutoff: ${sc.last} (${sc.toLast} days left). Mention it only as a gentle deadline.`),
   t&&!t.derived?`Trend angle: ${t.kw}`:'',`Audience: ${AUDE[S.aud]||S.aud}`,`Tone: ${TONE[S.tone][1]}`,`Style: ${STYLE[S.style][1]}`,S.angle?`Angle from the marketer: ${S.angle}`:'',S.sample?`Reference sample to match in voice (do not copy): ${S.sample}`:''].filter(Boolean).join('\n');
  const prompt=`You write Instagram posts for a US greeting-card brand. Write ${L==='en'?'American English':'Traditional Chinese (Taiwan)'}.
Facts you may use (do not invent prices, discounts, shipping promises, awards or statistics):
${fact}

Rules: no store or company name; 40-110 words for the caption; at most 2 emojis; no ALL CAPS; end the caption without hashtags. Give 6-8 hashtags (a single string, space separated, each starting with #). cta is one short sentence ending with "Link in bio." (or the Chinese equivalent). visual is one sentence in Traditional Chinese describing the photo or video to shoot. story is one sentence in Traditional Chinese for an Instagram Story idea.
Reply with only a JSON object: {"caption":"...","tags":"#a #b","cta":"...","visual":"...","story":"..."}`;
  AI.busy=true;AI.err='';AI.ctl=new AbortController();render();
  try{
    const o=await SMP.json(prompt,{modelTier:'default',cache:false,signal:AI.ctl.signal});
    if(!o||typeof o.caption!=='string'||!o.caption.trim())throw {code:'invalid_json'};
    S.gen={caption:o.caption.trim(),tags:String(o.tags||S.gen&&S.gen.tags||''),cta:String(o.cta||S.gen&&S.gen.cta||''),visual:String(o.visual||S.gen&&S.gen.visual||''),story:String(o.story||S.gen&&S.gen.story||'')};
    AI.busy=false;render();toast('已用 Claude 生成，可繼續編輯');
  }catch(e){AI.busy=false;if(e&&e.code==='cancelled')AI.err='';else AI.err=AIERR[e&&e.code]||'生成失敗，請再試一次。';render()}
}

  const y=window.scrollY;$('#pg').innerHTML=PAGES[S.page]();window.scrollTo(0,y);save();
